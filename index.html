<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel UI</title>
  
  <link rel="stylesheet" href="css/style.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
  
  <div class="phone">
    
    <!-- TOP -->
    <div class="top-bar">
      
      <img class="logo" src="image/logo.png">
      
      <div class="notification">
        <i class="fa-regular fa-bell"></i>
      </div>
      
    </div>
    
    <!-- TITLE -->
<div class="title-container">
  <h1 class="verixa-logo">VERIXA</h1>
  <p class="title-sub">Verify.Connect.Stay Updated </p>
</div>

    
    <!-- SEARCH -->
    <div class="search-box">
      
      <div class="search-input">
        Search
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
      </div>
      
      <div class="filter-btn">
        <i class="fa-solid fa-sliders"></i>
      </div>
      
    </div>
    
    <!-- GREEN CARD -->
    <div class="card green-card">
      
      <div class="card-top">
        
        <div class="user-info">
          
          
          
          <div>
            <h4>Register Association</h4>
            <p>Vehicle Plate</p>
          </div>
          
        </div>
        
        <a href="payment.html" class="pay-btn">
  Pay Now
</a>
        
      </div>
      
      <h2>
        Skip the Wahala
        Get Verified Fast
      </h2>
      
      <div class="badge">
        www.register
      </div>
      
      <div class="request">
        Latest Updates
      </div>
      
      <div class="members">
        
        <img src="https://i.pravatar.cc/100?img=14">
        <img src="https://i.pravatar.cc/100?img=15">
        <img src="https://i.pravatar.cc/100?img=16">
        
        <div class="plus">+</div>
        
      </div>
      
      <div class="chat-btn">
        <i class="fa-regular fa-comment"></i>
      </div>
      
    </div>
    
    <!-- BLUE CARD -->
    <div class="card blue-card">
      
      <h2 class="verify-title">Verify Any Association</h2> 
      <p>Vehicle Plate Number</p>
      
      
    </div>
    
  </div>
  
  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    
    <i class="fa-regular fa-bookmark"></i>
    
    <i class="fa-solid fa-magnifying-glass"></i>
    
    <div class="active-nav">
      <i class="fa-solid fa-location-crosshairs"></i>
    </div>
    
    <i class="fa-regular fa-comment"></i>
    
    <i class="fa-solid fa-phone"></i>
    
  </div>
  
  <script src="js/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VERIXA Registration</title>

<link rel="stylesheet"
href="css/register.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="register-page">

  <!-- TOP BAR -->

  <div class="top-bar">

    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <h2>Vehicle Registration</h2>

    <div class="top-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

  </div>

  <!-- HERO CARD -->

  <div class="hero-card">

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <span class="hero-badge">
        VERIFIED REGISTRATION
      </span>

      <h1>
        Register Your <br>
        Association Vehicle
      </h1>

      <p>
        Securely register and verify your association
        vehicle plate number through VERIXA.
      </p>

    </div>

  </div>

  <!-- FORM -->

  <div class="register-form">

    <!-- FULL NAME -->

    <div class="input-group">

      <label>Full Name</label>

      <div class="input-box">

        <i class="fa-regular fa-user"></i>

        <input
        type="text"
        placeholder="Enter full name">

      </div>

    </div>

    <!-- PHONE -->

    <div class="input-group">

      <label>Phone Number</label>

      <div class="input-box">

        <i class="fa-solid fa-phone"></i>

        <input
        type="tel"
        placeholder="Enter phone number">

      </div>

    </div>

    <!-- EMAIL -->

    <div class="input-group">

      <label>Email Address</label>

      <div class="input-box">

        <i class="fa-regular fa-envelope"></i>

        <input
        type="email"
        placeholder="Enter email address">

      </div>

    </div>

    <!-- ASSOCIATION -->

    <div class="input-group">

      <label>Association</label>

      <div class="input-box">

        <i class="fa-solid fa-building"></i>

        <input
        type="text"
        placeholder="Enter association">

      </div>

    </div>

    <!-- PLATE -->

    <div class="input-group">

      <label>Vehicle Plate Number</label>

      <div class="input-box">

        <i class="fa-solid fa-car"></i>

        <input
        type="text"
        placeholder="Enter plate number">

      </div>

    </div>

    <!-- VEHICLE TYPE -->

    <div class="input-group">

      <label>Vehicle Type</label>

      <div class="input-box">

        <i class="fa-solid fa-truck"></i>

        <select>

          <option>Select vehicle type</option>

          <option>Car</option>

          <option>Bus</option>

          <option>Truck</option>

          <option>Bike</option>

        </select>

      </div>

    </div>

    <!-- UPLOAD -->

    <div class="upload-box">

      <input
      type="file"
      id="vehicleImage"
      hidden>

      <label for="vehicleImage">

        <i class="fa-solid fa-cloud-arrow-up"></i>

        <span>
          Upload Vehicle Image
        </span>

      </label>

    </div>

    <!-- TERMS -->

    <div class="terms">

      <input type="checkbox">

      <p>
        I confirm that all information provided
        is correct and valid.
      </p>

    </div>

    <!-- BUTTON -->

    <button class="register-btn">

      Continue Registration

    </button>

  </div>

</div>

</body>
</html>
